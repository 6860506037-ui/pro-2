<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการพื้นที่ Co-Working Space อัจฉริยะ</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js สำหรับการวาดกราฟแสดงข้อมูล -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar สำหรับควบคุมระบบ (Collapsible & Off-canvas) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>เมนูจัดการระบบ</h2>
        <button id="close-sidebar-btn" class="mobile-only-btn">×</button>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" id="nav-dashboard">แดชบอร์ดภาพรวม</a>
        <a href="#" class="nav-item" id="nav-calendar">ตารางจองห้อง</a>
        <a href="#" class="nav-item" id="nav-analytics">สถิติและรายได้</a>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="top-header">
        <button id="toggle-sidebar-btn" class="toggle-btn">☰</button>
        <h1 class="page-title">แดชบอร์ดจัดการระบบ</h1>
        <button id="theme-toggle-btn" class="theme-toggle">สลับโหมด มืด/สว่าง</button>
      </header>

      <div class="dashboard-grid">
        <!-- ส่วนที่ 1: ตารางจองเวลา (Dynamic Calendar Grid) -->
        <section class="card calendar-card">
          <h3 class="card-title">สถานะห้องและตารางเวลาการจอง (09:00 - 18:00)</h3>
          <div class="calendar-wrapper">
            <div id="booking-calendar-grid" class="booking-grid">
              <!-- ข้อมูลปฏิทินจะถูกแทรกด้วย JavaScript -->
            </div>
          </div>
        </section>

        <!-- ส่วนที่ 2: กราฟแดชบอร์ดแสดงรายได้แต่ละห้อง (Chart.js) -->
        <section class="card chart-card">
          <h3 class="card-title">รายได้รวมรายห้องประชุม (บาท)</h3>
          <div class="chart-container">
            <canvas id="revenue-bar-chart"></canvas>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
